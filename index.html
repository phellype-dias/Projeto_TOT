<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/_header.css">
    <link rel="stylesheet" href="/css/_footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Projeto_TOT</title>
    <link rel="icon" href="/images/Logo_PH.png" type="image/png">
    <script src="/js/load_partials.js" defer></script>
</head>
<body>
    <header id="header" class="header-template-one"></header>

    <main>
        <div class="banner">
            <div class="content-banner">
                <div class="text-banner">
                    <h1>Aumente o engajamento dos seus treinamentos corporativos</h1>
                    <p>Aqui na TOT Educação Corporativa te ajudamos a revolucionar o Treinamento e Desenvolvimento da sua empresa. </p>
                    <a href="#form-container">Agendar demonstração</a>
                </div>
            </div>
            <img src="/images/Banner_Image.png" alt="">
        </div>

    <div class="anchor-container" id="form-container">
        <div class="form-container">
            <h2>Agende uma demonstração</h2>
    
            <form>
                <div class="form-input">
                    <input type="text" placeholder="Nome" required>
                </div>
    
                <div class="form-input">
                    <input type="email" placeholder="Seu email corporativo" required>
                </div>
    
                <div class="form-input">
                    <input type="text" placeholder="Qual empresa você trabalha?" required>
                </div>
    
                <div class="form-input">
                    <textarea rows="1" placeholder="Digite aqui como podemos te ajudar"></textarea>
                </div>
    
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>
    </main>
    
    <footer id="footer" class="footer"></footer>
</body>
</html>
